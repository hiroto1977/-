name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN は読み取りだけでよい (このワークフローは何も書かない)。
# 明示しないと、組織/リポジトリの既定 — 環境によっては contents: write —
# を継ぐ。他の 4 ワークフローは宣言済みで、ここと e2e だけが抜けていた
# (2026-08-22 の点検)。**一番よく走るものが一番広い権限**という状態だった。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single-job CI to minimize GitHub Actions minutes: one runner startup +
# one checkout + one setup-node + one `npm ci`, instead of paying that
# fixed overhead 3x across separate jobs. Gates run sequentially and fail
# fast. Per-group granularity was traded for minute efficiency (free-tier
# friendly); re-split into parallel jobs if richer triage is needed and
# minutes are no longer constrained. See docs/BROWSER_REDESIGN.md.
jobs:
  ci:
    name: ci (typecheck + verify + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # quality: typecheck + arch/verify + lint
      - run: npm run typecheck
      - run: npm run verify:arch
      - run: npm run lint:forbidden
      - run: npm run lint:workflow-security
      - run: npm run lint:network-targets
      - run: npm run lint:url-encoding
      - run: npm run lint:regex
      - run: npm run lint:imports
      - run: npm run lint:docs
      - run: npm run lint:citations
      - run: npm run lint:doi-prefix
      - run: npm run lint:charset
      - run: npm run lint:knowledge-refs
      - run: npm run lint:test-coverage
      - run: npm run lint:shell
      - run: npm run lint:repo-size
      - run: npm run lint:data-origin
      - run: npm run lint:credential-use
      - run: npm run lint:ipc-handlers
      - run: npm run lint:mutation-scope
      - run: npm run lint:collection-time
      - run: npm run lint:rate-freshness
      - run: npm run verify:orchestration
      - run: npm run vault:check
      - run: npm run verify:graph
      - run: npm run verify:knowledge
      - run: npm run chain:verify
      - run: npm run lint

      # test: full suite + main-process coverage
      - run: npm test
      - run: npm run test:cov

      # build: web build already runs `tsc -b && vite build` then inlines,
      # so it is a superset of build:renderer — no need to build twice.
      - run: npm run build:web
      - name: Verify standalone.html size
        run: |
          if [ ! -f dist/standalone.html ]; then
            echo "standalone.html not generated" >&2
            exit 1
          fi
          SIZE=$(stat -c%s dist/standalone.html)
          echo "standalone.html size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "standalone.html is suspiciously small" >&2
            exit 1
          fi
          # 上限。LITE 側には以前から 4MB の天井があったが、フル版は下限だけで
          # **青天井**だった。知識コーパスは増え続けるので、暴走的な増加
          # (巨大アセットの誤同梱・遅延ロードの解除など) を検知できる位置に
          # 天井を置く。2026-08-11 実測 11,200,073 B に対し約 43% の余裕。
          # 通常のコーパス増加では当たらず、桁違いの増加でだけ落ちる。
          if [ "$SIZE" -gt 16000000 ]; then
            echo "standalone.html exceeds 16MB — 巨大アセットの誤同梱か遅延ロードの解除を疑う" >&2
            exit 1
          fi

      # 公開経路と同じ後段 (inject-pwa) を、**実物**に当てる。
      #
      # 2026-07-24 の Pages 障害 (PWA タグがバンドルの真ん中へ splice されて
      # 公開版が開けなくなった) は、e2e もアーティファクト検査も**注入前の**
      # ファイルを見ていたため公開して初めて分かった。inject-pwa 自身は
      # 3 つのガード (注入位置 / SW ハッシュ / 既存ハッシュの保全) を持つが、
      # pages.yml は main でしか走らないので、それが実物に当たるのは
      # merge 後になる。ここで当てておけば PR の段階で落ちる。
      # dist/ は build:web:lite が空にするので、その前に控えを取る。
      - name: Verify PWA injection on the real artifacts
        run: |
          mkdir -p /tmp/inject-check
          cp dist/standalone.html /tmp/inject-check/app.html
          node scripts/inject-pwa.cjs /tmp/inject-check/app.html
          # 冪等であること (pages.yml は同じファイルに 2 度当たりうる)。
          node scripts/inject-pwa.cjs /tmp/inject-check/app.html

      # Pages 専用ビルド (pages.yml は main でしか走らない) を PR 段階で検証する。
      # 2026-07 の landing 自己検証落ち (士業カテゴリ追従漏れ) の再発防止。
      # 各スクリプトは自己検証付きなので、走らせること自体がテストになる。
      # build:web:lite は dist/ を空にして standalone.html を消費するため最後に実行。
      - run: npm run build:landing
      # ランディングにも同じ後段を当てる。**ここで当てる**のは、次の
      # build:web:lite が dist/ を空にして landing.html ごと消すため
      # (この順序を読み違えて 1 度 CI を落とした — 手元では build:landing を
      # 直前に走らせていたので再現しなかった)。ランディングは CSP を持たない
      # ので CSP 追記は起きない。その「起きないこと」も経路の一部。
      - name: Verify PWA injection on the landing page
        run: |
          mkdir -p /tmp/inject-check
          cp dist/landing.html /tmp/inject-check/index.html
          node scripts/inject-pwa.cjs /tmp/inject-check/index.html
      - run: npm run build:demo
      - run: npm run build:deliberation-demo
      - run: npm run build:research-demo
      - run: npm run build:web:lite
      - name: Verify standalone-lite.html size
        run: |
          if [ ! -f dist/standalone-lite.html ]; then
            echo "standalone-lite.html not generated" >&2
            exit 1
          fi
          SIZE=$(stat -c%s dist/standalone-lite.html)
          echo "standalone-lite.html size: $SIZE bytes"
          if [ "$SIZE" -lt 500000 ]; then
            echo "standalone-lite.html is suspiciously small" >&2
            exit 1
          fi
          if [ "$SIZE" -gt 4000000 ]; then
            echo "standalone-lite.html exceeds 4MB — 学術コーパス除去 (SERVICE_HUB_LITE) が効いていない可能性" >&2
            exit 1
          fi
          # 天井に当たってから気づくと、その PR は「無関係な変更なのに落ちた」
          # ように見える。85% (3.4MB) を超えたら警告を出し、余裕が減っている
          # ことを先に知らせる。**落とさない** — 警告で落とすと結局同じ事故になる。
          if [ "$SIZE" -gt 3400000 ]; then
            PCT=$((SIZE * 100 / 4000000))
            echo "::warning::standalone-lite.html が上限 4MB の ${PCT}% ($SIZE B) に達しています。LITE はスマホ回線向けなので、次の増加で天井に当たる前に何を積んでいるか確認してください。"
          fi

      # 残る公開対象 (LITE) にも同じ後段を当てる。
      - name: Verify PWA injection on the lite build
        run: |
          cp dist/standalone-lite.html /tmp/inject-check/lite.html
          node scripts/inject-pwa.cjs /tmp/inject-check/lite.html
