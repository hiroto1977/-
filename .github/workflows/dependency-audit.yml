name: dependency-audit

# 依存の勧告を毎日きちんと見に行き、要対応を常設 Issue 1 つに集める。
# 毎日 07:00 JST（22:00 UTC）。knowledge-auto（同 06:00 JST）とずらす。
# 2026-10-11 (パス 509) に週次から毎日へ。勧告は新規に公開されるので、週 1 回だと
# 最長 6 日、公開から気付くまで遅れた。Issue は 1 つを書き換えるだけなので、毎日走っても
# 通知の量は増えない (開く・閉じるは要対応の有無で決まるので、0 件の日は閉じたまま)。
#
# **なぜ PR の門ではなく毎日の予定実行なのか。**
# `ci.yml` は `npm audit --omit=dev --audit-level=high` だけを落とす。
# 狭くしたのは正しい判断で（勧告は日々変わり、無関係な PR が赤くなると
# 「赤を無視する習慣」がついて門が門でなくなる）、そこは変えない。
# だが 2026-09-10（パス 143）に、**狭くした外側を誰も見ていない**ことが
# 実害になった —— 検査を走らせる道具そのもののパストラバーサル
# (GHSA-82fw-gwwq-j7x9) と js-yaml の DoS (high) が、手で `npm audit` を
# 打つまで誰にも見えていなかった。
# 同じ日に、`qs` の床 `^6.15.2` が据えた **24 日後**に低すぎになっていたのも
# 実測した（`lint:deps` の checkedOn 警告は 180 日なので間に合わない）。
#
# **週次の予定実行は誰の PR も赤くしない**ので、上の懸念は当たらない。
# knowledge-auto.yml が既に採っている型（結果は Issue・片付いたら自動で閉じる）に揃える。

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}

concurrency:
  group: dependency-audit
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: 依存の勧告・セキュリティの床・SHA 固定（毎日の報告）
    runs-on: ubuntu-latest
    # 遅いレジストリで 1 つの待ちが全体を飲まないよう、npm の各呼び出しにも締切がある (NPM_TIMEOUT_MS)。
    # 台帳の穴の開け直し (T-226) が vitest を穴の数だけ走らせるので、その分を足した (30 → 75 分)。
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (threat: T-057)
        with:
          persist-credentials: false # threat: T-056
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (threat: T-057)
        with:
          node-version: '22'
          cache: 'npm'

      # 出荷物の検査には Electron の実体が要らない（ci.yml と同じ理由）。
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # 全体 / prod の npm audit と、床ちょうどの版の測り直し、workflow の SHA 固定の実在確認
      # (`git ls-remote` · パス 535 · threat: T-124。`lint:workflow-security` は形までしか見られない)。
      # **勧告が在っても exit 0**（報告する道具なので、赤にしても見る人がいない）。
      # 測れなかったときだけ落ちる —— 「測れていない」を「0 件」として通さない。
      # 台帳の穴を 1 つずつ開け直し、名指しの回帰検査が鳴るかを測る (パス 565 · threat: T-226)。
      # 捕まえ損ねは報告 (Issue) が要対応として言うので `--report` で exit 0 —— 道具の誤りだけ落ちる。
      # 網に触れない (書き換えて vitest を走らせ、必ず元へ戻す)。結果は次の step が読む。
      - name: 台帳の穴を開け直す
        timeout-minutes: 45
        run: npm run audit:threat-ablation -- --report --json orchestration/threat-ablation.json

      - name: 勧告と床を測る
        if: ${{ !cancelled() }}
        run: npm run audit:report

      - name: 報告をアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (threat: T-057)
        with:
          name: dependency-audit
          path: orchestration/dependency-audit.json
          retention-days: 90

      # 判断は `scripts/dependency-audit-issue.cjs` (self-test + vitest つき)。YAML の中に書いた
      # script は検査できず、実際に `state: 'open'` で探して閉じる形 —— 閉じた翌週に要対応が
      # 戻ると 2 つ目を作る —— が 2026-09-17 (パス 306) まで残っていた (この workflow は 1 度も
      # 走っていない)。github-script の `require` は workspace 相対で解決する。
      # 測れなかった項目も要対応として Issue に載せる道具なので、測定の step が「測れず」で落ちても
      # 報告ファイルが在れば反映する (2026-10-22: 測れず → step 失敗 → この step が飛び、Issue が更新されなかった)。
      - name: 要対応を Issue に反映
        if: ${{ !cancelled() && hashFiles('orchestration/dependency-audit.json') != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 (threat: T-057)
        with:
          script: |
            const { syncIssue } = require('./scripts/dependency-audit-issue.cjs');
            const report = JSON.parse(require('fs').readFileSync('orchestration/dependency-audit.json', 'utf8'));
            const result = await syncIssue({ github, context, report });
            core.info(`dependency-audit issue: ${result.action}${result.number === null ? '' : ` #${result.number}`}`);
