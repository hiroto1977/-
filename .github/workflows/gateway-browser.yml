# zero-trust-gateway の第 3 層の画面 (GET /auth/) を、本物のブラウザで通す検査。
#
# 画面の動き (この端末の鍵を作る・DPoP の証明を組む・物理キーとパスキーを呼ぶ) は本物のブラウザでしか走らない。
# pytest (ci.yml) が見るのは「出す物の形」と「書き方の決まり」まで —— ここは画面を押して、入口と通しで確かめる。
#   - 入口は runner の中の 127.0.0.1 だけで動かし (tests/browser/serve.py)、外へは出ない。
#   - 試しの控え (登録コード・登録済みの鍵・発行元の証明書) はその場で作り、一時ディレクトリごと消す。
#   - 認証器は Chromium の試験用の物 (virtual authenticator)。物理キーの「登録が通る」形はここでは試せない
#     (試験用の認証器は登録のたびに新しい自作の証明書を作るので、入口は正しく断る)。
#
# chromium を落とすので、毎 PR ではなく **zero-trust-gateway を触ったときだけ** 走る (ci.yml の分を増やさない)。
name: gateway-browser

on:
  pull_request:
    paths:
      - 'zero-trust-gateway/**'
      - '.github/workflows/gateway-browser.yml'
  push:
    branches: [main]
    paths:
      - 'zero-trust-gateway/**'
      - '.github/workflows/gateway-browser.yml'
  workflow_dispatch:

# 読むだけで、書き込みは一切しない。
permissions:
  contents: read

jobs:
  auth-page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (threat: T-057)
        with:
          persist-credentials: false # threat: T-056

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 (threat: T-057)
        with:
          node-version: '22'
          cache: 'npm'

      # 下の版の確かめ (verify-e2e-playwright-pin) は、リポジトリの lockfile から増えた物だけを見るので先に入れる。
      - name: Install
        run: npm ci

      # e2e.yml と同じ版と同じ確かめ (lockfile の外で入れるので、取得した tarball を台帳と突き合わせる · threat: T-125)。
      - name: Install Playwright module (pinned, not saved)
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1

      - name: Verify Playwright integrity (pinned ledger)
        run: node scripts/verify-e2e-playwright-pin.cjs --self-test && node scripts/verify-e2e-playwright-pin.cjs

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # 依存は、版とハッシュで固定した一覧だけから入れる (ci.yml の pytest の段と同じ形)。
      - name: Install gateway dependencies (hash-pinned)
        run: |
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 12) else "Python 3.12 以上が要ります")'
          python3 -m venv "$RUNNER_TEMP/zt-venv"
          "$RUNNER_TEMP/zt-venv/bin/pip" install --quiet --disable-pip-version-check --only-binary=:all: --require-hashes -r zero-trust-gateway/requirements.txt

      - name: Drive the sign-in page in Chromium
        run: ZT_PYTHON="$RUNNER_TEMP/zt-venv/bin/python" node zero-trust-gateway/tests/browser/auth_page.cjs
