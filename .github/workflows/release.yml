name: release

on:
  push:
    tags:
      - 'v*'
  # タグを push できない環境 (Claude Code のリモートセッションは指定ブランチ以外の
  # ref を送れない) からもリリースを切れるように、手動起動を用意する。
  # tag_name を渡すと softprops/action-gh-release が起動時の SHA にタグを作る。
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  # **検査と署名を別の job (別の runner) にする** (threat: T-144)。
  # 以前は `npm ci` / `npm test` / `verify:all` と、署名鍵 (CSC_LINK ほか) を env に持つ Build が
  # 同じ job・同じ runner に居た。マージされた PR が 1 つ (または乗っ取られた devDependency が 1 つ)
  # あれば、`npm test` が import する 1,000 本超のテストの 1 つが `$GITHUB_ENV` に
  # `NODE_OPTIONS=--require …` を追記でき、続く Build の `node` が署名鍵を読める
  # (隔離した複製で実測: 39 ゲート全部が exit 0 のまま鍵を持ち出せた)。
  # ここは secrets を 1 つも持たず contents: read だけで、build job は検査の runner を引き継がない。
  verify:
    name: verify ${{ matrix.os }}
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5 (threat: T-057)
        with:
          persist-credentials: false # threat: T-056

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5 (threat: T-057)
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      # **タグはどのコミットも指せる。** trigger は `tags: v*` なので、
      # CI が一度も通っていないコミットにタグを打っても、ここは動く。
      # ci.yml は push: main / PR にしか起動しないので、リリース経路には効かない。
      # だから全ゲートもここで回す —— 出すのはこのワークフローである。
      - name: Typecheck + test + gates
        run: |
          npm run typecheck
          npm test
          npm run verify:all

  build:
    name: build ${{ matrix.os }}
    needs: verify
    # デプロイできる ref は main と v* タグだけ (workflow_dispatch で任意の branch に置いた
    # 改変版の release.yml が署名鍵を読めないようにする)。`release` environment に
    # 必須レビュアーを置くと、署名鍵の使用に人の承認が要る (GitHub の設定 —— 未設定でも害は無い)。
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write  # required for softprops/action-gh-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_glob: |
              release/*.AppImage
              release/*.deb
              release/SHA256SUMS-*.txt
          - os: macos-latest
            # arch を x64/arm64 の両方に指定したので dmg が 2 つ出る
            # (`-x64.dmg` / `-arm64.dmg`)。glob はどちらも拾う。
            artifact_glob: |
              release/*.dmg
              release/*.dmg.blockmap
              release/SHA256SUMS-*.txt
          - os: windows-latest
            artifact_glob: |
              release/*.exe
              release/*.exe.blockmap
              release/SHA256SUMS-*.txt
    runs-on: ${{ matrix.os }}
    # **3 OS すべてで bash を使う。**
    #
    # 既定の shell は windows-latest だけ pwsh になる。この workflow の
    # `run:` は最初から bash 前提で書かれており (`if [ -n "${APPLE_ID:-}" ]`、
    # `ls -la`、`dist/assets/*.js` の glob)、pwsh では
    #   - `ls -la` が Get-ChildItem に束縛されて -la を解決できない
    #   - native コマンドの引数を **glob 展開しない**ので `dist/assets/*.js`
    #     がリテラルで渡り、lint-sample-data.cjs が「成果物が見つかりません」
    #     で exit 1 (実測)
    # となり、**Windows ジョブが softprops の手前で落ちる**。
    # `fail-fast: false` なので Linux/macOS は公開まで進み、
    # **Windows インストーラだけ欠けたリリース**が出る ——
    # `verify-release-artifacts.cjs` が防ぐために書かれた当の失敗で、
    # 同じジョブの手前で走るあの門からは見えない。
    #
    # リリースはタグでしか走らないので未発火だった (2026-08-28 のレビューで検出)。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5 (threat: T-057)
        with:
          persist-credentials: false # threat: T-056

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5 (threat: T-057)
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      # 検査 (typecheck / npm test / verify:all) は上の verify job で済ませた (needs: verify)。
      # この job は署名鍵を持つので、検査のコードを走らせた runner とは別である (threat: T-144)。

      # electron-builder は CI を検知すると **暗黙に** GitHub Releases へ publish
      # しようとする (v0.1.0 の失敗ランで実際に発火し、softprops ステップと二重
      # アップロードになりかけた)。公開は下の softprops に一本化するため、
      # ビルドは常に --publish never で行う。
      # 署名は **secrets がある時だけ** 効く。electron-builder は CSC_LINK が
      # 無ければ署名を飛ばして (macOS では ad-hoc 署名で) ビルドを続けるので、
      # 証明書を用意していない段階でもリリースは作れる。
      #
      # 用意する secrets (すべて任意・入れた分だけ効く):
      #   CSC_LINK              … 証明書 (.p12) の base64。mac / win 共通
      #   CSC_KEY_PASSWORD      … その .p12 のパスワード
      #   APPLE_ID              … Apple ID (公証用)
      #   APPLE_APP_SPECIFIC_PASSWORD … アプリ用パスワード (公証用)
      #   APPLE_TEAM_ID         … Team ID (公証用)
      #
      # 公証は APPLE_ID が入っている時だけ有効化する。未設定のまま
      # notarize を on にすると **署名が無い状態で公証を試みて失敗する**ため、
      # 設定の有無で分岐させる (無条件に on にはしない)。
      - name: Build
        run: |
          if [ -n "${APPLE_ID:-}" ] && [ "${RUNNER_OS}" = "macOS" ]; then
            echo "公証あり (APPLE_ID 設定済み) でビルドします"
            npm run build -- --publish never --config.mac.notarize=true
          else
            npm run build -- --publish never
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # electron-builder は「失敗せずに何も出さない」ことがある (target 設定の
      # 取り違え、arch の取りこぼしなど)。下の softprops は
      # fail_on_unmatched_files: false なので、そのまま **配布物ゼロでも緑**に
      # なり、fail-fast: false と噛み合うと **1 プラットフォーム欠けたリリースが
      # 全ジョブ緑で公開される**。
      #
      # electron-builder.json の宣言 (target と arch) から必要本数を出して
      # 突き合わせる。glob 一致では足りない —— dmg を x64/arm64 で宣言していても
      # `release/*.dmg` は arm64 だけで一致してしまうため。
      # RUNNER_OS は runner の組み込み変数なので ${{ }} の展開は要らない。
      # 梱包後に解決できない require が主プロセスの束に残っていないか。
      #
      # electron-builder が入れるのは dist/** dist-electron/** build/icon.png
      # package.json だけ。それ以外を指す require が残っていると、**梱包した
      # ときだけ落ちる**。2026-08-26 に実際にそうなっていた (バンドラが
      # 実行時 require を書き換えないため) —— 画面も Electron も要らない
      # 静的な検査なので、ここで先に通す。
      - name: Verify bundled requires resolve after packaging
        run: node scripts/smoke-app.cjs --check-bundle

      - name: Verify release artifacts
        run: node scripts/verify-release-artifacts.cjs

      # 公開する物の SHA-256 を、**同じランの中で**書き出す。
      #
      # v0.1.0 では 16 時間差の 2 ランが同じ版の AppImage を上げ、
      # 最初のぶんが消されないまま今も 2 つ並んでいる (サイズ差 36 バイト)。
      # チェックサムが無いので、**どちらが正規のビルドか利用者に判定する
      # 材料が無かった**。同じランで出しておけば、少なくとも
      # 「この SHA256SUMS を出したランは、この AppImage を出した」が言える。
      #
      # **これは改竄検知ではない。** 署名の無いチェックサムが見つけられるのは
      # 転送中の破損と上のような取り違えまでで、リリース資産を書き換え
      # られる者は隣の SHA256SUMS も書き換えられる。本当の改竄耐性は署名で、
      # それは上の `CSC_LINK` 系 secrets が入っている時だけ効く。
      - name: Write checksums for the published artifacts
        run: node scripts/checksum-release.cjs

      # 出す物そのものに個人データが混ざっていないか。
      #
      # `ci.yml` / `pages.yml` はブラウザ版の HTML に当てているが、
      # **デスクトップ版のバンドルには誰も当てていなかった** (2026-08-25)。
      # `electron-builder.json` の `files` は `dist/**/*` を含むので、
      # `dist/assets/index-*.js` (実測 11.4MB) は**全インストーラの中に入る**。
      # 中身はブラウザ版と同じレンダラー束なので「今の構成なら同じ物」だが、
      # それは構成が保証しているだけで、規則が保証していることではない ——
      # 同じ理屈で `.json` の取りこぼしを見逃したのが今日の朝である。
      # 実測 11.4MB に対して 0.7 秒。
      - name: Scan the desktop bundle for real personal data
        run: |
          ls -la dist/ dist/assets/
          node scripts/lint-sample-data.cjs --artifact dist/index.html dist/assets/*.js

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # タグ push なら ref_name がタグ。手動起動なら入力値を使い、タグが
          # 無ければこのランの SHA に新規作成される。
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: ${{ matrix.artifact_glob }}
          # blockmap は electron-builder が必ず出すとは限らないので、
          # 不一致で落とさない。「主要インストーラが宣言どおり出たか」は
          # 上の Verify ステップが先に確かめている (ここを true にすると
          # blockmap の有無で **正しいリリースが赤になる**)。
          fail_on_unmatched_files: false
          generate_release_notes: true
