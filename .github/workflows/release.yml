name: release

on:
  push:
    tags:
      - 'v*'
  # タグを push できない環境 (Claude Code のリモートセッションは指定ブランチ以外の
  # ref を送れない) からもリリースを切れるように、手動起動を用意する。
  # tag_name を渡すと softprops/action-gh-release が起動時の SHA にタグを作る。
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write  # required for softprops/action-gh-release

jobs:
  build:
    name: build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_glob: |
              release/*.AppImage
              release/*.deb
          - os: macos-latest
            # arch を x64/arm64 の両方に指定したので dmg が 2 つ出る
            # (`-x64.dmg` / `-arm64.dmg`)。glob はどちらも拾う。
            artifact_glob: |
              release/*.dmg
              release/*.dmg.blockmap
          - os: windows-latest
            artifact_glob: |
              release/*.exe
              release/*.exe.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck + test
        run: |
          npm run typecheck
          npm test

      # electron-builder は CI を検知すると **暗黙に** GitHub Releases へ publish
      # しようとする (v0.1.0 の失敗ランで実際に発火し、softprops ステップと二重
      # アップロードになりかけた)。公開は下の softprops に一本化するため、
      # ビルドは常に --publish never で行う。
      # 署名は **secrets がある時だけ** 効く。electron-builder は CSC_LINK が
      # 無ければ署名を飛ばして (macOS では ad-hoc 署名で) ビルドを続けるので、
      # 証明書を用意していない段階でもリリースは作れる。
      #
      # 用意する secrets (すべて任意・入れた分だけ効く):
      #   CSC_LINK              … 証明書 (.p12) の base64。mac / win 共通
      #   CSC_KEY_PASSWORD      … その .p12 のパスワード
      #   APPLE_ID              … Apple ID (公証用)
      #   APPLE_APP_SPECIFIC_PASSWORD … アプリ用パスワード (公証用)
      #   APPLE_TEAM_ID         … Team ID (公証用)
      #
      # 公証は APPLE_ID が入っている時だけ有効化する。未設定のまま
      # notarize を on にすると **署名が無い状態で公証を試みて失敗する**ため、
      # 設定の有無で分岐させる (無条件に on にはしない)。
      - name: Build
        run: |
          if [ -n "${APPLE_ID:-}" ] && [ "${RUNNER_OS}" = "macOS" ]; then
            echo "公証あり (APPLE_ID 設定済み) でビルドします"
            npm run build -- --publish never --config.mac.notarize=true
          else
            npm run build -- --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # electron-builder は「失敗せずに何も出さない」ことがある (target 設定の
      # 取り違え、arch の取りこぼしなど)。下の softprops は
      # fail_on_unmatched_files: false なので、そのまま **配布物ゼロでも緑**に
      # なり、fail-fast: false と噛み合うと **1 プラットフォーム欠けたリリースが
      # 全ジョブ緑で公開される**。
      #
      # electron-builder.json の宣言 (target と arch) から必要本数を出して
      # 突き合わせる。glob 一致では足りない —— dmg を x64/arm64 で宣言していても
      # `release/*.dmg` は arm64 だけで一致してしまうため。
      # RUNNER_OS は runner の組み込み変数なので ${{ }} の展開は要らない。
      - name: Verify release artifacts
        run: node scripts/verify-release-artifacts.cjs

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # タグ push なら ref_name がタグ。手動起動なら入力値を使い、タグが
          # 無ければこのランの SHA に新規作成される。
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: ${{ matrix.artifact_glob }}
          # blockmap は electron-builder が必ず出すとは限らないので、
          # 不一致で落とさない。「主要インストーラが宣言どおり出たか」は
          # 上の Verify ステップが先に確かめている (ここを true にすると
          # blockmap の有無で **正しいリリースが赤になる**)。
          fail_on_unmatched_files: false
          generate_release_notes: true
