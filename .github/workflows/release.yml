name: release

on:
  push:
    tags:
      - 'v*'
  # タグを push できない環境 (Claude Code のリモートセッションは指定ブランチ以外の
  # ref を送れない) からもリリースを切れるように、手動起動を用意する。
  # tag_name を渡すと softprops/action-gh-release が起動時の SHA にタグを作る。
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write  # required for softprops/action-gh-release

jobs:
  build:
    name: build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_glob: |
              release/*.AppImage
              release/*.deb
          - os: macos-latest
            artifact_glob: |
              release/*.dmg
              release/*.dmg.blockmap
          - os: windows-latest
            artifact_glob: |
              release/*.exe
              release/*.exe.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck + test
        run: |
          npm run typecheck
          npm test

      # Per-OS electron-builder runs. On non-tag CI runs we'd want
      # `--publish never`, but this workflow is gated on a tag so we let
      # electron-builder pick its defaults.
      - name: Build
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # タグ push なら ref_name がタグ。手動起動なら入力値を使い、タグが
          # 無ければこのランの SHA に新規作成される。
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: ${{ matrix.artifact_glob }}
          fail_on_unmatched_files: false
          generate_release_notes: true
