<!doctype html><html lang="ja"><meta charset="utf-8"><title>ローカルAI組織の村</title>
<style>body{margin:0;overflow:hidden;font-family:sans-serif}#hud{white-space:pre-wrap;position:fixed;left:10px;top:10px;background:#fffc;border-radius:10px;padding:8px 12px;max-width:440px;font-size:13px}

<script type="module">

box(110,1,110,0x7cc95a,0,-.5,0,S,false);box(9,.3,9,0xd9b77a,0,.1,0,S,false);

box(4,2.5,.3,0x7a5230,7,2.5,-5);box(.3,2,.3,0x4a3018,5.2,.8,-5);box(.3,2,.3,0x4a3018,8.8,.8,-5); // 掲示板

  if(opt.tie)box(.15,.6,.05,opt.tie,0,1.1,.31,g,false);if(opt.crown)box(.7,.25,.7,0xffd700,0,2.55,0,g,false);

let ORG=null,built=false;const toSel=document.getElementById('to');
function build(org,st){ORG=org;const ppl=org.people,by=id=>ppl.find(p=>p.id===id);
  mkChar('coo','COO（全社統括）',0,-9,COLORS.COO,{house:1.3,roof:0xffd700,big:true,tie:0xc62828});

    const sec=ppl.find(p=>p.tier==='秘書'&&p.parent===e.id);const px=-Math.sin(a)*3,pz=Math.cos(a)*3;
    if(sec)mkChar(sec.id,sec.name,x+px,z+pz,COLORS.秘書,{tie:EXC[e.id],scale:.9});
    const mg=ppl.filter(p=>p.tier==='管理職'&&p.parent===e.id);
    mg.forEach((m,j)=>{const b=a+(j-(mg.length-1)/2)*.42,mx=Math.cos(b)*30,mz=Math.sin(b)*30;

      mkChar(m.id,m.name,mx,mz,COLORS.管理職,{desk:[0,1],tie:EXC[e.id],wander:false});
      ppl.filter(p=>p.tier==='一般職'&&p.parent===m.id).forEach((s,k)=>{const sx=mx+Math.cos(b+Math.PI/2)*(k?2.2:-2.2)+Math.cos(b)*2.5,sz=mz+Math.sin(b+Math.PI/2)*(k?2.2:-2.2)+Math.sin(b)*2.5;
        mkChar(s.id,s.name,sx,sz,COLORS.一般職,{desk:[0,1],scale:.85,wander:false})})})});
  for(const p of ppl){const o=document.createElement('option');o.value=p.id;o.textContent=`${p.name}（${p.tier}）に話す`;toSel.appendChild(o)}
  mkChar('me',org.user+'（CEO・あなた）',0,2.6,0xffffff,{big:true,crown:true,wander:false});
  Object.keys(st.services).forEach((s,i)=>mkChar('s:'+s,s,-43+(i%4)*3.3,36+Math.floor(i/4)*4,COLORS.svc,{scale:.7,svc:true,wander:false}));
  O.target.set(0,0,0);built=true}
async function poll(){try{
  if(!ORG){const org=await (await fetch('/api/org')).json();const st0=await (await fetch('/api/state')).json();build(org,st0)}

  document.getElementById('hud').textContent=`ローカルAI組織：${st.status}\n議題: ${(st.topic||'').slice(0,120)}\n担当役員: ${(st.exec||'-').toUpperCase()} ・ 空きメモリ ${st.free_mb}MB ・ 更新 ${st.updated}`;
  document.getElementById('decs').textContent='\n'+st.decisions.slice().reverse().join('\n\n――――\n\n');
  const cl=document.getElementById('log');cl.replaceChildren(...st.chat.map(c=>{const d=document.createElement('div');d.textContent=`${c.who}: ${c.text}`;return d}));cl.scrollTop=1e9;
  const inMeeting=st.status.startsWith('会議中'),ids=new Set(inMeeting?st.transcript.map(t=>t.id):[]);if(inMeeting&&st.speaking)ids.add(st.speaking);
  for(const [k,A] of Object.entries(agents)){if(A.svc||k==='me')continue;A.speaking=ids.has(k);if(!(A.hold>Date.now()))A.bub.style.display='none'}
  const last=st.transcript[st.transcript.length-1];if(last&&agents[last.id]){const A=agents[last.id];A.bub.textContent=last.text.replace(/\s+/g,' ').slice(0,110)+(last.text.length>110?'…':'');A.bub.style.display='block'}
  if(st.speaking&&agents[st.speaking]&&inMeeting){const A=agents[st.speaking];if(!last||last.id!==st.speaking){A.bub.textContent='（考え中…）';A.bub.style.display='block'}}
  const mine=st.chat.filter(c=>c.who===st.user).pop();if(mine&&agents.me){agents.me.bub.textContent=mine.text.slice(0,80);agents.me.bub.style.display='block'}

 }catch(e){document.getElementById('hud').textContent='状態を取得できません: '+e}}
poll();setInterval(poll,4000);
function resolveAt(t){const m=t.match(/^[@＠](\S+)\s*/);if(!m||!ORG)return null;const q=m[1].toLowerCase();
  const p=ORG.people.find(p=>p.id.toLowerCase()===q||p.name.toLowerCase()===q)||ORG.people.find(p=>p.name.toLowerCase().includes(q));return p?{id:p.id,rest:t.slice(m[0].length)||t}:null}
async function sendMsg(){let t=document.getElementById('msg').value.trim();if(!t)return;const at=resolveAt(t);if(at){toSel.value=at.id;t=at.rest}const to=toSel.value;
  if(to&&agents[to]){const A=agents[to];A.called=Date.now()+60000;A.bub.textContent='（はい、なんでしょう？）';A.bub.style.display='block';A.hold=Date.now()+60000}const stEl=document.getElementById('st');
  stEl.textContent=' 送信中…';document.getElementById('msg').value='';
  try{const r=await fetch(to?'/api/chat':'/api/topic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to,text:t})});const j=await r.json();
    stEl.textContent=to?'':' COOに届けました';if(to&&agents[j.id]){const A=agents[j.id];A.bub.textContent=j.text.replace(/\s+/g,' ').slice(0,110);A.bub.style.display='block';A.hold=Date.now()+20000;A.called=Date.now()+20000}poll()}catch(e){stEl.textContent=' 失敗: '+e}}
document.getElementById('send').onclick=sendMsg;document.getElementById('msg').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)sendMsg()};
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();

  const hit=ray.intersectObjects(Object.entries(agents).filter(([k,A])=>!A.svc&&k!=='me').map(([,A])=>A.g),true)[0];

function tint(){const h=+new Intl.DateTimeFormat('en',{hour:'numeric',hourCycle:'h23',timeZone:'Asia/Tokyo'}).format(new Date());
  const day=h>=6&&h<17,dusk=h===17||h===18||h===5;S.background=new THREE.Color(day?0x9fd8ff:dusk?0xf4a261:0x1b2340);sun.intensity=day?1.2:dusk?.7:.25;hemi.intensity=day?1:.5}
tint();setInterval(tint,60000);
const clock=new THREE.Clock(),v=new THREE.Vector3(),SEATS=[];for(let i=0;i<8;i++){const a=i/8*Math.PI*2;SEATS.push(new THREE.Vector3(Math.cos(a)*2.6,0,Math.sin(a)*2.6*.8))}
const PLAZA=[new THREE.Vector3(0,0,6),new THREE.Vector3(10,0,8),new THREE.Vector3(-10,0,8),new THREE.Vector3(7,0,-3),new THREE.Vector3(-12,0,-6),new THREE.Vector3(20,0,20),new THREE.Vector3(-22,0,18)];
function pickGoal(A){const r=Math.random();A.door=null;
  if(r<.3&&DOORS.length){const d=DOORS[Math.floor(Math.random()*DOORS.length)];A.door=d;A.target.copy(d)}
  else if(r<.55)A.target.copy(A.home).add(new THREE.Vector3(Math.random()*4-2,0,Math.random()*4-2));
  else if(r<.75)A.target.copy(PLAZA[Math.floor(Math.random()*PLAZA.length)]).add(new THREE.Vector3(Math.random()*3-1.5,0,Math.random()*3-1.5));
  else {const B=Object.values(agents)[Math.floor(Math.random()*Object.keys(agents).length)];A.target.copy(B.home).add(new THREE.Vector3(2,0,2))}
  A.state='walk'}
window.__ST=location.search.includes("selftest");let __frames=0;function loop(){__frames++;const dt=Math.min(clock.getDelta(),.1),T=clock.elapsedTime;let seat=0;const list=Object.values(agents);
  for(const [k,A] of Object.entries(agents)){A.t+=dt;
    if(!A.up){A.g.rotation.z=1.4;A.g.position.y=.3}else{A.g.rotation.z=0;
      if(A.called>Date.now()){A.g.visible=true;A.inside=0;A.g.lookAt(C.position.x,0,C.position.z);A.g.position.y=0;A.head.position.y=1.95+Math.sin(T*6)*.05}
      else{
      if(A.speaking){A.g.visible=true;A.inside=0;A.target.copy(SEATS[(seat++)%8]);A.state='walk';A.door=null}
      else if(A.wander&&A.inside>0){A.inside-=dt;if(A.inside<=0){A.g.visible=true;A.g.position.copy(A.door||A.home);A.door=null;A.state='pause';A.t=0}}
      else if(A.wander&&A.state==='idle'){pickGoal(A)}
      else if(A.state==='pause'&&A.t>2+Math.random()*4){A.state=A.wander?'idle':'pause';A.t=0}
      else if(!A.wander)A.target.copy(A.home);
      if(A.g.visible){const d=v.subVectors(A.target,A.g.position);d.y=0;const L=d.length();
        // 衝突回避: 近い住民から離れる
        for(const B of list){if(B===A||!B.g.visible)continue;const dx=A.g.position.x-B.g.position.x,dz=A.g.position.z-B.g.position.z,q=dx*dx+dz*dz;if(q<1.2&&q>1e-4){A.g.position.x+=dx/q*dt*.6;A.g.position.z+=dz/q*dt*.6}}
        if(L>.15&&A.state!=='pause'){A.g.position.addScaledVector(d.normalize(),Math.min(L,dt*(A.speaking?4:2.2)));A.g.rotation.y=Math.atan2(d.x,d.z);A.g.position.y=Math.abs(Math.sin(T*10))*.15;A.body.rotation.x=0;
          A.g.children[5]&&(A.g.children[4].rotation.x=Math.sin(T*10)*.5,A.g.children[5].rotation.x=-Math.sin(T*10)*.5)}
        else{A.g.position.y=0;
          if(A.speaking)A.g.lookAt(0,0,0);
          else if(A.state==='walk'){if(A.door&&Math.random()<.7){A.g.visible=false;A.inside=5+Math.random()*12}else{A.state='pause';A.t=0}}
          else if(A.desk&&A.g.position.distanceTo(A.home)<1){A.head.position.y=1.95+Math.abs(Math.sin(T*12+A.t))*.06;A.body.rotation.x=.12}}}}}

    if(A.bub.style.display==='block'){A.bub.style.display=A.g.visible?'block':'none';A.bub.style.left=x+'px';A.bub.style.top=(y-24)+'px'}}
  O.update();R.render(S,C);(window.__ST?setTimeout(loop,33):requestAnimationFrame(loop))}

if(location.search.includes('selftest')){setTimeout(()=>{window.__p0=Object.fromEntries(Object.entries(agents).map(([k,A])=>[k,A.g.position.clone()]))},3000);
  setTimeout(()=>{let moved=0,hidden=0;for(const [k,A] of Object.entries(agents)){if(A.g.position.distanceTo(window.__p0[k])>.5)moved++;if(!A.g.visible)hidden++}

    document.getElementById('msg').value='@CFO 村の様子はどうですか？';sendMsg()},9000)}
