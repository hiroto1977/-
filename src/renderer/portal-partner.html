<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      社外へ配る単一 HTML の雛形 (パートナーポータル)。この CSP は組む途中の物で、配る HTML では
      scripts/build-portal.cjs が「畳み込んだスクリプトのハッシュだけ・網へは出ない」形へ置き換える。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <title>パートナーポータル</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./portal/partnerMain.tsx"></script>
  </body>
</html>
